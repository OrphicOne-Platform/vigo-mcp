# .github/workflows/vigo-weekly.yml
name: VIGO Weekly Quality

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  VIGO_CHAT_URL: ${{ secrets.VIGO_CHAT_URL }}

jobs:
  weekly-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pdfplumber python-dotenv openpyxl python-docx
      - name: Run Mode 13e - Data Quality
        run: python auto_collect_upload.py --mode 13 --sub e --non-interactive
        timeout-minutes: 40
      - name: Run Mode 14e - Full Inspection
        run: python auto_collect_upload.py --mode 14 --sub e --non-interactive
        timeout-minutes: 40
