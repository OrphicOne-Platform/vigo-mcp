# .github/workflows/vigo-daily.yml
name: VIGO Daily Sync

on:
  schedule:
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  VIGO_CHAT_URL: ${{ secrets.VIGO_CHAT_URL }}

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pdfplumber python-dotenv openpyxl python-docx
      - name: Run Mode 1 - Daily Sync
        run: python auto_collect_upload.py --mode 1 --sub e --non-interactive
        timeout-minutes: 8
      - name: Run Mode 14a - Conflict Detection
        run: python auto_collect_upload.py --mode 14 --sub a --non-interactive
        timeout-minutes: 5
