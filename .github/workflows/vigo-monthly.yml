# .github/workflows/vigo-monthly.yml
name: VIGO Monthly Maintenance

on:
  schedule:
    - cron: '0 0 15 * *'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  VIGO_CHAT_URL: ${{ secrets.VIGO_CHAT_URL }}

jobs:
  monthly-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pdfplumber python-dotenv openpyxl python-docx
      - name: Run Mode 6 - Industry Intelligence
        run: python auto_collect_upload.py --mode 6 --sub e --non-interactive
        timeout-minutes: 15
      - name: Run Mode 9 - VATP Deep
        run: python auto_collect_upload.py --mode 9 --sub e --non-interactive
        timeout-minutes: 10
      - name: Run Mode 13e - Data Quality
        run: python auto_collect_upload.py --mode 13 --sub e --non-interactive
        timeout-minutes: 20
      - name: Run Mode 12e - Structured Extract
        run: python auto_collect_upload.py --mode 12 --sub e --non-interactive
        timeout-minutes: 10
      - name: Run Mode 11a - Eval
        run: python auto_collect_upload.py --mode 11 --sub a --non-interactive
        timeout-minutes: 15
