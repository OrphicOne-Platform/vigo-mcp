# .github/workflows/vigo-daily.yml
# VIGO 每日自動同步（週一至週五）
# Mode 1 日常採集 → Mode 14a 衝突檢測

name: VIGO Daily Sync

on:
  schedule:
    # 每日 23:00 UTC = 07:00 HKT (次日)，週日至週四
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pdfplumber

      - name: Run Mode 1 - Daily Sync
        run: python auto_collect_upload.py --mode 1 --sub e --non-interactive
        timeout-minutes: 8

      - name: Run Mode 14a - Conflict Detection
        run: python auto_collect_upload.py --mode 14 --sub a --non-interactive
        timeout-minutes: 5

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-sync-${{ github.run_number }}
          path: reports/*.json
          retention-days: 14

      - name: Notify on failure
        if: failure()
        run: echo "::error::VIGO Daily Sync failed! Check logs."
